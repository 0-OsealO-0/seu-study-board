he boy of his education is a violation of state law.", "chinese": "剥夺这个男孩的受教育权是一种违反州法律的行为。"}, {"english": "The judge called the decision \"a flagrant violation of international law.\"", "chinese": "法官称这个决定是“对国际法的公然违反”。"}], "collocations": []}, {"number": 22, "word": "abide by", "ipa": "əˈbaɪd baɪ", "part_of_speech": "", "definition": "to accept and act according to a law, an agreement, etc. 遵守，遵照（法规、约定等）", "examples": [{"english": "You'll have to abide by the rules of the club.", "chinese": "你必须遵守俱乐部的规定。"}, {"english": "We are not free agents; we abide by the decisions of our president.", "chinese": "我们不是自由不需负责任的人；我们遵守总统的决定。"}], "collocations": []}, {"number": 23, "word": "hinge on", "ipa": "hɪndʒ ɒn", "part_of_speech": "", "definition": "to depend on sth completely 有赖于；取决于", "examples": [{"english": "The plan hinges on a deal being struck with a new company.", "chinese": "该计划完全取决于正在和一家新公司谈的一笔交易。"}, {"english": "His success hinges on how well he does at the interview.", "chinese": "他能否成功要看他在面试中的表现。"}], "collocations": []}, {"number": 24, "word": "in conformity with", "ipa": "ɪn kənˈfɔːməti wɪð", "part_of_speech": "", "definition": "following the rules of sth; conforming to sth 遵循（规则）；与…相符合（或一致）", "examples": [{"english": "These regulations are in conformity with European law.", "chinese": "这些规章符合欧洲法律。"}, {"english": "The prime minister is, in conformity with their constitution, chosen by the president.", "chinese": "首相是遵照宪法由总统选定的。"}], "collocations": []}, {"number": 25, "word": "scale up", "ipa": "skeɪl ʌp", "part_of_speech": "", "definition": "to increase the size or number of sth 增大，扩大（规模或数量）", "examples": [{"english": "All in all, it's a great business that should be easy to scale up.", "chinese": "总之，这是一项很好的业务，应该很容易扩大规模。"}, {"english": "Agricultural commodity producers should be supported to diversify and scale up their production.", "chinese": "我们应该支持农产品生产主体的多元化规模化发展。"}], "collocations": []}], "phraseGroups": [{"paragraph": 1, "entries": [{"number": 1, "chinese": "成熟的机制", "english": "full-fledged mechanisms"}, {"number": 2, "chinese": "加强融合", "english": "strengthen integration"}, {"number": 3, "chinese": "固有的对立", "english": "an intrinsic opposition"}, {"number": 4, "chinese": "零和博弈(游戏)", "english": "a zero-sum game"}, {"number": 5, "chinese": "长期主导", "english": "long-term dominance"}, {"number": 6, "chinese": "战胜对手", "english": "a/the triumph over opponents"}, {"number": 7, "chinese": "违背，与…背道而驰", "english": "run counter to"}, {"number": 8, "chinese": "建国信条", "english": "founding creed"}, {"number": 9, "chinese": "忠诚崩塌", "english": "collapse of loyalty"}, {"number": 10, "chinese": "随之而来的危机", "english": "subsequent crisis"}, {"number": 11, "chinese": "地区动荡", "english": "regional unrest"}, {"number": 12, "chinese": "民族分裂主义", "english": "national separatism"}]}, {"paragraph": 2, "entries": [{"number": 1, "chinese": "激烈的暴力冲突", "english": "intense violent conflicts"}, {"number": 2, "chinese": "实现理想。", "english": "The ideal materializes."}, {"number": 3, "chinese": "规模空前扩大", "english": "scale up unprecedentedly"}, {"number": 4, "chinese": "战后余波", "english": "in the aftermath of the war"}, {"number": 5, "chinese": "得到一定程度的遏制", "english": "be curbed to a certain degree"}, {"number": 6, "chinese": "潜在的社会问题", "english": "a potential social issue"}]}, {"paragraph": 3, "entries": [{"number": 1, "chinese": "相继， 陆续", "english": "one after another"}, {"number": 2, "chinese": "新兴的民族国家", "english": "emerging nation-states"}, {"number": 3, "chinese": "在相当大的程度上", "english": "to a considerable degree"}, {"number": 4, "chinese": "被称为", "english": "be referred to as"}, {"number": 5, "chinese": "一套适合的治理体系", "english": "an agreeable system of governance"}, {"number": 6, "chinese": "以…的形式显现出来", "english": "be revealed in the form of…"}]}, {"paragraph": 4, "entries": [{"number": 1, "chinese": "区域联盟", "english": "regional alliances"}, {"number": 2, "chinese": "遇到的困难", "english": "difficulties encountered"}, {"number": 3, "chinese": "让位，让步", "english": "give way to"}, {"number": 4, "chinese": "保障生存", "english": "safeguard survival"}]}, {"paragraph": 5, "entries": [{"number": 1, "chinese": "自成立(诞生)以来", "english": "since the inception of"}, {"number": 2, "chinese": "时空的", "english": "spatial and temporal"}, {"number": 3, "chinese": "推进进程", "english": "advance the process"}, {"number": 4, "chinese": "在这方面", "english": "in this regard"}, {"number": 5, "chinese": "为…奠定基础", "english": "lay the foundation for"}]}, {"paragraph": 6, "entries": [{"number": 1, "chinese": "提出", "english": "put forth"}, {"number": 2, "chinese": "符合，与…一致", "english": "in conformity with"}, {"number": 3, "chinese": "最近结束的代表大会", "english": "recently concluded congress"}, {"number": 4, "chinese": "理论建设", "english": "theoretical construction"}, {"number": 5, "chinese": "不稳定因素", "english": "destabilizing factors"}, {"number": 6, "chinese": "制定总体布局", "english": "chart the overall layout"}, {"number": 7, "chinese": "开放包容的秩序", "english": "an open and inclusive order"}, {"number": 8, "chinese": "共同繁荣", "english": "common prosperity"}, {"number": 9, "chinese": "产生深远影响", "english": "exert profound impact on"}, {"number": 10, "chinese": "超出常规预计", "english": "beyond conventional estimations"}]}], "counts": {"vocabulary": 25, "phrases": 43, "paragraphs": 6}}</script>
    <script>
      (function () {
        "use strict";
        const data = JSON.parse(document.getElementById("resource-data").textContent);
        const state = { query: "", filter: "all" };
        const vocabList = document.getElementById("vocabulary-list");
        const phraseList = document.getElementById("phrase-list");
        const searchInput = document.getElementById("search-input");
        const resultStatus = document.getElementById("result-status");
        const emptyState = document.getElementById("empty-state");
        const vocabularySection = document.getElementById("vocabulary-section");
        const phraseSection = document.getElementById("phrase-section");

        function createElement(tag, className, text) {
          const element = document.createElement(tag);
          if (className) element.className = className;
          if (text !== undefined) element.textContent = text;
          return element;
        }

        function add(target, ...children) {
          children.filter(Boolean).forEach((child) => target.appendChild(child));
          return target;
        }

        function vocabularySearchText(entry) {
          return [
            entry.word,
            entry.ipa,
            entry.part_of_speech,
            entry.definition,
            ...entry.examples.flatMap((example) => [example.english, example.chinese]),
            ...entry.collocations
          ].join(" ").toLowerCase();
        }

        function phraseSearchText(entry) {
          return `${entry.chinese} ${entry.english}`.toLowerCase();
        }

        function renderVocabulary() {
          vocabList.textContent = "";
          data.vocabulary.forEach((entry) => {
            const card = createElement("article", "word-card");
            card.dataset.type = "vocabulary";
            card.dataset.search = vocabularySearchText(entry);

            const top = createElement("div", "word-top");
            const heading = createElement("div");
            const word = createElement("h3", "word", entry.word);
            heading.appendChild(word);
            if (entry.ipa) heading.appendChild(createElement("span", "phonetic", `/${entry.ipa}/`));
            top.appendChild(heading);
            if (entry.part_of_speech) top.appendChild(createElement("span", "pos", entry.part_of_speech));
            card.appendChild(top);

            card.appendChild(createElement("p", "definition", entry.definition || "见原词汇表"));
            if (entry.examples.length) {
              const list = createElement("ul", "examples");
              entry.examples.forEach((example) => {
                const item = createElement("li", "example");
                item.appendChild(createElement("div", "example-en", `• ${example.english}`));
                if (example.chinese) item.appendChild(createElement("span", "example-zh", example.chinese));
                list.appendChild(item);
              });
              card.appendChild(list);
            }
            if (entry.collocations.length) {
              const box = createElement("div", "collocations");
              box.appendChild(createElement("strong", "", "常用搭配"));
              box.appendChild(document.createTextNode(entry.collocations.join("；")));
              card.appendChild(box);
            }
            vocabList.appendChild(card);
          });
        }

        function renderPhrases() {
          phraseList.textContent = "";
          data.phraseGroups.forEach((group) => {
            const groupCard = createElement("section", "phrase-group");
            groupCard.dataset.type = "phrase-group";
            groupCard.appendChild(createElement("h3", "", `Para. ${group.paragraph}`));
            group.entries.forEach((entry) => {
              const row = createElement("div", "phrase-row");
              row.dataset.type = "phrase";
              row.dataset.search = phraseSearchText(entry);
              row.appendChild(createElement("div", "phrase-zh", entry.chinese));
              row.appendChild(createElement("div", "phrase-en", entry.english || ""));
              groupCard.appendChild(row);
            });
            phraseList.appendChild(groupCard);
          });
        }

        function applyFilters() {
          const query = state.query.trim().toLowerCase();
          let visible = 0;

          document.querySelectorAll(".word-card").forEach((card) => {
            const typeMatches = state.filter === "all" || state.filter === "vocabulary";
            const queryMatches = !query || card.dataset.search.includes(query);
            card.hidden = !(typeMatches && queryMatches);
            if (!card.hidden) visible += 1;
          });

          document.querySelectorAll(".phrase-group").forEach((group) => {
            let groupVisible = 0;
            group.querySelectorAll(".phrase-row").forEach((row) => {
              const typeMatches = state.filter === "all" || state.filter === "phrase";
              const queryMatches = !query || row.dataset.search.includes(query);
              row.hidden = !(typeMatches && queryMatches);
              if (!row.hidden) {
                groupVisible += 1;
                visible += 1;
              }
            });
            group.hidden = groupVisible === 0;
          });

          const showVocabulary = state.filter !== "phrase";
          const showPhrases = state.filter !== "vocabulary";
          vocabularySection.hidden = !showVocabulary;
          phraseSection.hidden = !showPhrases;
          emptyState.style.display = visible === 0 ? "block" : "none";
          resultStatus.textContent = query ? `当前显示 ${visible} 条匹配内容` : `当前显示 ${visible} 条内容`;
        }

        document.getElementById("tabs").addEventListener("click", (event) => {
          const button = event.target.closest(".tab");
          if (!button) return;
          state.filter = button.dataset.filter;
          document.querySelectorAll(".tab").forEach((tab) => {
            const active = tab === button;
            tab.classList.toggle("is-active", active);
            tab.setAttribute("aria-pressed", String(active));
          });
          applyFilters();
        });

        searchInput.addEventListener("input", () => {
          state.query = searchInput.value;
          applyFilters();
        });

        renderVocabulary();
        renderPhrases();
        applyFilters();
      })();
    </script>
  </body>
