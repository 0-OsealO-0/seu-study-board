name: Clear stuck Pages deployment

# 运维工作流：GitHub Pages 的部署卡在 in_progress 时，新的部署会被直接拒绝
# （400 "Deployment request failed ... due to in progress deployment"）。
# 这里把最近仍未进入终止态的 deployment 标记为 inactive，解除阻塞。
# 触发方式：改本文件后 push，或在 Actions 页面手动 Run workflow。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clear-stuck-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Deactivate unfinished deployments
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 只看按时间倒序的前 20 个 deployment，逐个读最新状态
          ids=$(curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/$REPO/deployments?per_page=20" | jq -r '.[].id')
          if [ -z "$ids" ]; then
            echo "no deployments found"
            exit 0
          fi
          for id in $ids; do
            last=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/repos/$REPO/deployments/$id/statuses" | jq -r '.[0].state')
            sha=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/repos/$REPO/deployments/$id" | jq -r '.sha[0:7]')
            echo "deployment $id ($sha) last state: $last"
            case "$last" in
              success|inactive)
                echo "  terminal, skip"
                ;;
              *)
                # in_progress / queued / pending 自不必说；failure、error 也要处理，
                # 因为 Pages 服务端有时仍把上一次失败的部署当成 in_progress 持有锁。
                echo "  marking inactive"
                curl -sS -X POST -H "Authorization: Bearer $TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO/deployments/$id/statuses" \
                  -d '{"state":"inactive"}' >/dev/null
                ;;
            esac
          done
          echo "clear pass done"
